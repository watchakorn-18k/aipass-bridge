<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIPass Copilot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' }
          }
        }
      }
    }
  </script>
</head>
<body class="w-[360px] bg-zinc-950 text-zinc-100 font-sans antialiased select-none p-3.5 space-y-3 border border-zinc-800 rounded-2xl overflow-hidden shadow-2xl">

  <!-- Header -->
  <div class="flex items-center justify-between pb-2.5 border-b border-zinc-800/80">
    <div class="flex items-center gap-2.5">
      <div class="h-7 w-7 rounded-xl bg-gradient-to-tr from-blue-600 to-cyan-400 flex items-center justify-center text-white shadow-md shadow-blue-500/20">
        <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
      </div>
      <div>
        <h1 class="text-xs font-bold text-zinc-100 flex items-center gap-1.5 leading-tight">
          AIPass Copilot
          <span class="rounded bg-blue-500/10 px-1 py-0.2 text-[9px] text-blue-400 border border-blue-500/20 font-mono">Bridge</span>
        </h1>
        <p class="text-[10px] text-zinc-500">Autonomous AI Assistant</p>
      </div>
    </div>

    <!-- Status Badge -->
    <div id="conn-badge" class="flex items-center gap-1.5 px-2 py-1 rounded-full bg-zinc-900 border border-zinc-800 text-[10px]">
      <span id="conn-dot" class="h-1.5 w-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
      <span id="conn-text" class="text-zinc-300 font-medium">Connecting</span>
    </div>
  </div>

  <!-- Real-Time Quota Card -->
  <div class="bg-gradient-to-b from-zinc-900/90 to-zinc-900/50 rounded-xl p-2.5 border border-zinc-800/80 space-y-2 shadow-inner">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-1.5">
        <i data-lucide="zap" class="w-3.5 h-3.5 text-amber-400"></i>
        <span class="text-xs font-semibold text-zinc-200">Credits Available</span>
      </div>
      <span id="quota-val" class="font-mono text-xs font-bold text-emerald-400">--</span>
    </div>

    <div class="w-full bg-zinc-800 rounded-full h-1.5 overflow-hidden">
      <div id="quota-bar" class="bg-gradient-to-r from-blue-500 to-emerald-400 h-full rounded-full transition-all duration-500" style="width: 100%;"></div>
    </div>

    <div class="flex items-center justify-between text-[9px] text-zinc-500">
      <span id="quota-detail">Used: -- / Limit: --</span>
      <span id="user-plan" class="rounded bg-blue-500/10 px-1.5 py-0.2 text-blue-400 border border-blue-500/20">Free Plan</span>
    </div>
  </div>

  <!-- Quick Actions on Current Page -->
  <div class="space-y-1.5">
    <div class="text-[10px] font-semibold text-zinc-400 uppercase tracking-wider px-0.5">Quick Actions on Current Tab</div>
    <div class="grid grid-cols-2 gap-1.5 text-xs">
      <button id="btn-qa-summarize" class="flex items-center gap-2 p-2 rounded-xl bg-zinc-900/90 hover:bg-blue-600/20 hover:border-blue-500/40 border border-zinc-800 text-left text-zinc-200 transition-all">
        <i data-lucide="file-text" class="w-3.5 h-3.5 text-blue-400 shrink-0"></i>
        <span class="truncate font-medium text-[11px]">Summarize Page</span>
      </button>
      <button id="btn-qa-code" class="flex items-center gap-2 p-2 rounded-xl bg-zinc-900/90 hover:bg-indigo-600/20 hover:border-indigo-500/40 border border-zinc-800 text-left text-zinc-200 transition-all">
        <i data-lucide="code-2" class="w-3.5 h-3.5 text-indigo-400 shrink-0"></i>
        <span class="truncate font-medium text-[11px]">Extract Code</span>
      </button>
    </div>
  </div>

  <!-- Settings & Config -->
  <div class="space-y-2 pt-1 border-t border-zinc-800/80 text-xs">
    <!-- Model Select -->
    <div>
      <label for="model" class="text-[10px] font-medium text-zinc-400 block mb-1 flex items-center justify-between">
        <span>Default Model</span>
        <span id="count" class="text-zinc-500 font-mono text-[9px]"></span>
      </label>
      <div class="relative">
        <select id="model" class="w-full bg-zinc-900 border border-zinc-700/60 rounded-xl px-2.5 py-1.5 text-[11px] text-zinc-200 focus:outline-none focus:border-blue-500 cursor-pointer appearance-none">
          <option value="gemini-3.1-flash-lite">gemini-3.1-flash-lite [Free]</option>
        </select>
        <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-zinc-400 absolute right-2.5 top-2 pointer-events-none"></i>
      </div>
    </div>

    <!-- Bridge URL -->
    <div>
      <label for="url" class="text-[10px] font-medium text-zinc-400 block mb-1">Bridge Server URL</label>
      <input id="url" spellcheck="false" placeholder="http://157.85.96.7:8787" class="w-full bg-zinc-900 border border-zinc-700/60 rounded-xl px-2.5 py-1.5 text-[11px] text-zinc-200 placeholder-zinc-500 focus:outline-none focus:border-blue-500 font-mono">
    </div>

    <!-- Action Buttons -->
    <div class="flex items-center gap-2 pt-1">
      <button id="save" class="flex-1 rounded-xl bg-blue-600 hover:bg-blue-500 active:scale-[0.99] text-white text-[11px] font-medium py-2 px-3 shadow-md shadow-blue-600/20 transition-all flex items-center justify-center gap-1.5">
        <i data-lucide="save" class="w-3 h-3"></i>
        <span>Save &amp; Connect</span>
      </button>
      <button id="btn-open-dash" class="rounded-xl bg-zinc-900 hover:bg-zinc-800 border border-zinc-700/60 p-2 text-zinc-300 hover:text-white transition-colors" title="Open Web Dashboard">
        <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
      </button>
      <button id="refresh" class="rounded-xl bg-zinc-900 hover:bg-zinc-800 border border-zinc-700/60 p-2 text-zinc-300 hover:text-white transition-colors" title="Refresh Models &amp; Status">
        <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
      </button>
    </div>

    <div id="err" class="text-[10px] text-red-400 font-mono empty:hidden bg-red-500/10 border border-red-500/20 rounded-lg p-1.5"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>

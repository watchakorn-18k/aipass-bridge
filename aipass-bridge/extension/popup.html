<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AIPass Copilot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 340px;
      background: #09090b;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 12px;
      line-height: 1.5;
      padding: 14px;
      user-select: none;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid #27272a;
      margin-bottom: 12px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo-icon {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: linear-gradient(135deg, #2563eb, #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 16px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
    }
    .title-box h1 {
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      font-size: 9px;
      font-family: monospace;
      padding: 1px 5px;
      border-radius: 4px;
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }
    .subtitle {
      font-size: 10px;
      color: #71717a;
    }
    .status-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px 8px;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 500;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }
    .dot.down {
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
    }
    .card {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .card-title {
      font-size: 11px;
      font-weight: 600;
      color: #d4d4d8;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .card-val {
      font-family: monospace;
      font-weight: 700;
      font-size: 13px;
      color: #34d399;
    }
    .progress-track {
      width: 100%;
      height: 6px;
      background: #27272a;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 8px;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #10b981);
      border-radius: 6px;
      transition: width 0.4s ease;
    }
    .card-foot {
      display: flex;
      justify-content: space-between;
      font-size: 9px;
      color: #71717a;
    }
    .section-label {
      font-size: 10px;
      font-weight: 600;
      color: #a1a1aa;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .btn-quick {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 10px;
      padding: 8px 10px;
      color: #e4e4e7;
      font-size: 11px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-quick:hover {
      background: #27272a;
      border-color: #3b82f6;
      color: #ffffff;
    }
    .btn-quick:active {
      transform: scale(0.98);
    }
    .field-group {
      margin-bottom: 10px;
    }
    .field-label {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      font-weight: 500;
      color: #a1a1aa;
      margin-bottom: 4px;
    }
    select, input {
      width: 100%;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 11px;
      color: #f4f4f5;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }
    select:focus, input:focus {
      border-color: #3b82f6;
    }
    .bottom-actions {
      display: flex;
      gap: 6px;
      margin-top: 12px;
    }
    .btn-primary {
      flex: 1;
      background: #2563eb;
      border: 1px solid #3b82f6;
      border-radius: 8px;
      padding: 8px 12px;
      color: #ffffff;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }
    .btn-primary:hover {
      background: #1d4ed8;
    }
    .btn-icon {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 8px;
      padding: 8px 10px;
      color: #a1a1aa;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    .btn-icon:hover {
      background: #27272a;
      color: #ffffff;
    }
    #err {
      font-size: 10px;
      color: #f87171;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-radius: 6px;
      padding: 6px 8px;
      margin-top: 8px;
      display: none;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 2l2.4 7.2L21.6 12l-7.2 2.4L12 21.6l-2.4-7.2L2.4 12l7.2-2.4L12 2zm0 4.8l-1.1 3.3-3.3 1.1 3.3 1.1 1.1 3.3 1.1-3.3 3.3-1.1-3.3-1.1L12 6.8z"/></svg>
      </div>
      <div class="title-box">
        <h1>AIPass Copilot <span class="badge">Bridge</span></h1>
        <div class="subtitle">Autonomous AI Assistant</div>
      </div>
    </div>
    <div class="status-pill">
      <div id="conn-dot" class="dot"></div>
      <span id="conn-text" style="color:#d4d4d8;">Connected</span>
    </div>
  </div>

  <!-- Real-Time Quota Card -->
  <div class="card">
    <div class="card-top">
      <div class="card-title">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="#f59e0b" style="display:inline-block;vertical-align:middle;margin-right:4px;"><path d="M13 10h7l-9 13v-9H4l9-13v9z"/></svg>
        Credits Available
      </div>
      <div id="quota-val" class="card-val">--</div>
    </div>
    <div class="progress-track">
      <div id="quota-bar" class="progress-bar" style="width: 100%;"></div>
    </div>
    <div class="card-foot">
      <span id="quota-detail">Used: -- / Limit: --</span>
      <span id="user-plan" class="badge">Free Plan</span>
    </div>
  </div>

  <!-- Quick Actions -->
  <div class="section-label">Quick Actions on Current Tab</div>
  <div class="grid-2">
    <button id="btn-qa-summarize" class="btn-quick">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="#60a5fa"><path d="M21 8v12.993A1 1 0 0 1 20.007 22H3.993A.993.993 0 0 1 3 21.008V2.992C3 2.455 3.449 2 4.002 2h10.995L21 8zm-2 1h-5V4H5v16h14V9zM8 7h3v2H8V7zm0 4h8v2H8v-2zm0 4h8v2H8v-2z"/></svg>
      Summarize Page
    </button>
    <button id="btn-qa-code" class="btn-quick">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="#a78bfa"><path d="M24 12l-5.657 5.657-1.414-1.414L21.172 12l-4.243-4.243 1.414-1.414L24 12zM2.828 12l4.243 4.243-1.414 1.414L0 12l5.657-5.657L7.07 7.757 2.828 12zm6.96 8.944l4.242-17.888 1.94.46-4.242 17.889-1.94-.46z"/></svg>
      Extract Code
    </button>
  </div>

  <!-- Config -->
  <div class="field-group">
    <div class="field-label">
      <span>Default Model</span>
      <span id="count" style="font-family:monospace; color:#71717a;"></span>
    </div>
    <select id="model">
      <option value="gemini-3.1-flash-lite">gemini-3.1-flash-lite [Free]</option>
    </select>
  </div>

  <div class="field-group">
    <div class="field-label">
      <span>Bridge Server URL</span>
    </div>
    <input id="url" spellcheck="false" placeholder="http://157.85.96.7:8787">
  </div>

  <div class="bottom-actions">
    <button id="save" class="btn-primary">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M18 21H6a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3h10.586a1 1 0 0 1 .707.293l4.414 4.414a1 1 0 0 1 .293.707V18a3 3 0 0 1-3 3zm-6-2a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm4-12H6v4h10V7z"/></svg>
      Save &amp; Connect
    </button>
    <button id="btn-open-dash" class="btn-icon" title="Open Web Dashboard">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M10 6v2H5v11h11v-5h2v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h6zm11-3v8h-2V6.413l-7.793 7.794-1.414-1.414L17.585 5H13V3h8z"/></svg>
    </button>
    <button id="refresh" class="btn-icon" title="Refresh">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M5.463 4.433A9.961 9.961 0 0 1 12 2c5.523 0 10 4.477 10 10 0 2.136-.67 4.116-1.81 5.74L17 12h3A8 8 0 0 0 6.46 6.228l-.997-1.795zm13.074 15.134A9.961 9.961 0 0 1 12 22C6.477 22 2 17.523 2 12c0-2.136.67-4.116 1.81-5.74L7 12H4a8 8 0 0 0 13.54 5.772l.997 1.795z"/></svg>
    </button>
  </div>

  <div id="err"></div>

  <script src="popup.js"></script>
</body>
</html>

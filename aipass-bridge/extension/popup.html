<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AIPass Copilot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 340px;
      background: #09090b;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 12px;
      line-height: 1.5;
      padding: 14px;
      user-select: none;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid #27272a;
      margin-bottom: 12px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo-icon {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: linear-gradient(135deg, #2563eb, #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 16px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
    }
    .title-box h1 {
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      font-size: 9px;
      font-family: monospace;
      padding: 1px 5px;
      border-radius: 4px;
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }
    .subtitle {
      font-size: 10px;
      color: #71717a;
    }
    .status-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px 8px;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 500;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }
    .dot.down {
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
    }
    .card {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .card-title {
      font-size: 11px;
      font-weight: 600;
      color: #d4d4d8;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .card-val {
      font-family: monospace;
      font-weight: 700;
      font-size: 13px;
      color: #34d399;
    }
    .progress-track {
      width: 100%;
      height: 6px;
      background: #27272a;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 8px;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #10b981);
      border-radius: 6px;
      transition: width 0.4s ease;
    }
    .card-foot {
      display: flex;
      justify-content: space-between;
      font-size: 9px;
      color: #71717a;
    }
    .section-label {
      font-size: 10px;
      font-weight: 600;
      color: #a1a1aa;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .btn-quick {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 10px;
      padding: 8px 10px;
      color: #e4e4e7;
      font-size: 11px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-quick:hover {
      background: #27272a;
      border-color: #3b82f6;
      color: #ffffff;
    }
    .btn-quick:active {
      transform: scale(0.98);
    }
    .field-group {
      margin-bottom: 10px;
    }
    .field-label {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      font-weight: 500;
      color: #a1a1aa;
      margin-bottom: 4px;
    }
    select, input {
      width: 100%;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 11px;
      color: #f4f4f5;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }
    select:focus, input:focus {
      border-color: #3b82f6;
    }
    .bottom-actions {
      display: flex;
      gap: 6px;
      margin-top: 12px;
    }
    .btn-primary {
      flex: 1;
      background: #2563eb;
      border: 1px solid #3b82f6;
      border-radius: 8px;
      padding: 8px 12px;
      color: #ffffff;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }
    .btn-primary:hover {
      background: #1d4ed8;
    }
    .btn-icon {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 8px;
      padding: 8px 10px;
      color: #a1a1aa;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    .btn-icon:hover {
      background: #27272a;
      color: #ffffff;
    }
    #err {
      font-size: 10px;
      color: #f87171;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-radius: 6px;
      padding: 6px 8px;
      margin-top: 8px;
      display: none;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div class="logo-icon">✨</div>
      <div class="title-box">
        <h1>AIPass Copilot <span class="badge">Bridge</span></h1>
        <div class="subtitle">Autonomous AI Assistant</div>
      </div>
    </div>
    <div class="status-pill">
      <div id="conn-dot" class="dot"></div>
      <span id="conn-text" style="color:#d4d4d8;">Connected</span>
    </div>
  </div>

  <!-- Real-Time Quota Card -->
  <div class="card">
    <div class="card-top">
      <div class="card-title">
        <span>⚡</span> Credits Available
      </div>
      <div id="quota-val" class="card-val">--</div>
    </div>
    <div class="progress-track">
      <div id="quota-bar" class="progress-bar" style="width: 100%;"></div>
    </div>
    <div class="card-foot">
      <span id="quota-detail">Used: -- / Limit: --</span>
      <span id="user-plan" class="badge">Free Plan</span>
    </div>
  </div>

  <!-- Quick Actions -->
  <div class="section-label">Quick Actions on Current Tab</div>
  <div class="grid-2">
    <button id="btn-qa-summarize" class="btn-quick">
      <span>📄</span> Summarize Page
    </button>
    <button id="btn-qa-code" class="btn-quick">
      <span>💻</span> Extract Code
    </button>
  </div>

  <!-- Config -->
  <div class="field-group">
    <div class="field-label">
      <span>Default Model</span>
      <span id="count" style="font-family:monospace; color:#71717a;"></span>
    </div>
    <select id="model">
      <option value="gemini-3.1-flash-lite">gemini-3.1-flash-lite [Free]</option>
    </select>
  </div>

  <div class="field-group">
    <div class="field-label">
      <span>Bridge Server URL</span>
    </div>
    <input id="url" spellcheck="false" placeholder="http://157.85.96.7:8787">
  </div>

  <div class="bottom-actions">
    <button id="save" class="btn-primary">
      <span>💾</span> Save &amp; Connect
    </button>
    <button id="btn-open-dash" class="btn-icon" title="Open Web Dashboard">
      <span>↗</span>
    </button>
    <button id="refresh" class="btn-icon" title="Refresh">
      <span>↻</span>
    </button>
  </div>

  <div id="err"></div>

  <script src="popup.js"></script>
</body>
</html>
